services:
  - type: web
    name: iiko-helper-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_PATH
        value: logs/iiko_knowledge_bot.log
      - key: STORAGE_DIR
        value: storage
      - key: KNOWLEDGE_BASE_PATH
        value: knowledge/iiko_sources.json
      - key: WEBHOOK_BASE_URL
        value: https://iiko-helper-bot.onrender.com
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: PAYMENT_CARD_NUMBER
        value: 9860160602619274
      - key: PAYMENT_PRICE_UZS
        value: 100000
      - key: PAYMENT_OWNER_NAME
        value: Sultanov Samandar
      - key: PAYMENT_BOT_USERNAME
        value: Sct_xo_Payment_BOT
      - key: PAYMENT_SITE_URL
        value: https://vedavector-iiko.netlify.app
